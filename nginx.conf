map $request_body $newsletter_payload {
    default "";
    "~^kb_field_0=(?<newsletter_email>[a-zA-Z0-9%+._~*-]{1,768})&kb_field_1=accept&_kb_verify_email=&_kb_form_id=[a-zA-Z0-9_-]+&_kb_form_post_id=[0-9]+&action=kb_process_ajax_submit&_kb_form_verify=(?<newsletter_nonce>[a-f0-9]{10})$" "kb_field_0=$newsletter_email&kb_field_1=accept&_kb_verify_email=&_kb_form_verify=$newsletter_nonce&$newsletter_fields";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/suscripcion.conf;

    # Que los redirects mantengan el esquema del cliente (https detrás del proxy)
    # y sean relativos para no perder el scheme original
    absolute_redirect off;
    port_in_redirect off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Cache de assets versionados (Astro añade hash en filenames)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes, vídeo y fuentes con caché
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SEO files
    location = /robots.txt {
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # La Epístola #21 se creó inicialmente en WordPress con un guion bajo.
    # La URL pública canónica usa solo guiones; conservar la antigua como 301.
    location = /epistolas/21_prueba-con-el-martes {
        return 301 /epistolas/21-prueba-con-el-martes/;
    }

    location = /epistolas/21_prueba-con-el-martes/ {
        return 301 /epistolas/21-prueba-con-el-martes/;
    }

    # Borradores que no deben responder 200. Astro solo emite un HTML de
    # redirección, y nginx lo serviría como página. Aquí el 301 es HTTP.
    location = /creatuvida-borrador-9f2c {
        return 301 /creatuvida/;
    }

    location = /creatuvida-borrador-9f2c/ {
        return 301 /creatuvida/;
    }

    location = /home-provisional {
        return 301 /;
    }

    location = /home-provisional/ {
        return 301 /;
    }

    # Astro genera /pagina/index.html para cada ruta — try_files maneja /pagina como /pagina/index.html.
    # El HTML se revalida siempre: si no, el navegador conserva la página anterior
    # y, al cambiar de ruta, enseña un menú ya sustituido en el servidor.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # No cachear feed RSS (puede actualizarse con nuevos episodios)
    location = /podcast/feed.xml {
        expires off;
        add_header Cache-Control "public, max-age=300";
    }

    # Página de error 404 personalizada, generada por Astro
    error_page 404 /404.html;
}
