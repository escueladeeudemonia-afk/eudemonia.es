server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Que los redirects mantengan el esquema del cliente (https detrás del proxy)
    # y sean relativos para no perder el scheme original
    absolute_redirect off;
    port_in_redirect off;

    # Servicio privado editorial en la misma red Docker. Resolver en runtime:
    # una caída del editor no impide que nginx sirva la web pública.
    location = /admin { return 302 /admin/; }
    location ^~ /admin/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $editorial_backend http://editorial:4322;
        proxy_pass $editorial_backend;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_http_version 1.1;
        proxy_read_timeout 35s;
        client_max_body_size 300k;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Cache de assets versionados (Astro añade hash en filenames)
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes, vídeo y fuentes con caché
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|mp4|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SEO files
    location = /robots.txt {
        access_log off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # La Epístola #21 se creó inicialmente en WordPress con un guion bajo.
    # La URL pública canónica usa solo guiones; conservar la antigua como 301.
    location = /epistolas/21_prueba-con-el-martes {
        return 301 /epistolas/21-prueba-con-el-martes/;
    }

    location = /epistolas/21_prueba-con-el-martes/ {
        return 301 /epistolas/21-prueba-con-el-martes/;
    }

    # La URL principal de la #23 es exactamente la enviada por email.
    # La ruta con guiones redirige al enlace original, con www y guion bajo.
    location = /epistolas/23-dale-oxigeno-a-tu-mente {
        return 301 https://www.eudemonia.es/epistolas/23_dale-oxigeno-a-tu-mente/;
    }

    location = /epistolas/23-dale-oxigeno-a-tu-mente/ {
        return 301 https://www.eudemonia.es/epistolas/23_dale-oxigeno-a-tu-mente/;
    }

    # CTV se vende en la Escuela; el dominio de la Fundación solo redirige.
    location = /creatuvida {
        return 301 https://escueladeeudemonia.com/creatuvida/$is_args$args;
    }

    location = /creatuvida/ {
        return 301 https://escueladeeudemonia.com/creatuvida/$is_args$args;
    }

    location = /creatuvida/index.html {
        return 301 https://escueladeeudemonia.com/creatuvida/$is_args$args;
    }

    location = /creatuvida/gracias-ctv {
        return 301 https://escueladeeudemonia.com/creatuvida/gracias-ctv/$is_args$args;
    }

    location = /creatuvida/gracias-ctv/ {
        return 301 https://escueladeeudemonia.com/creatuvida/gracias-ctv/$is_args$args;
    }

    location = /creatuvida/gracias-ctv/index.html {
        return 301 https://escueladeeudemonia.com/creatuvida/gracias-ctv/$is_args$args;
    }

    # Borradores que no deben responder 200. Astro solo emite un HTML de
    # redirección, y nginx lo serviría como página. Aquí el 301 es HTTP.
    location = /creatuvida-borrador-9f2c {
        return 301 /creatuvida/;
    }

    location = /creatuvida-borrador-9f2c/ {
        return 301 /creatuvida/;
    }

    location = /home-provisional {
        return 301 /;
    }

    location = /home-provisional/ {
        return 301 /;
    }

    # Astro genera /pagina/index.html para cada ruta — try_files maneja /pagina como /pagina/index.html.
    # El HTML se revalida siempre: si no, el navegador conserva la página anterior
    # y, al cambiar de ruta, enseña un menú ya sustituido en el servidor.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # No cachear feed RSS (puede actualizarse con nuevos episodios)
    location = /podcast/feed.xml {
        expires off;
        add_header Cache-Control "public, max-age=300";
    }

    # Página de error 404 personalizada, generada por Astro
    error_page 404 /404.html;
}
