# --- 8. PRECIO Y CONDICIONES ------------------------------------------
precio:
  titulo: "Precio"
  intro: "Dos precios según quién paga. El de empresas es el precio base. El de particulares y pequeños autónomos está ajustado para que sea accesible."
  opciones:
    - titulo: "Particulares y pequeños autónomos"
      precio: "416 €"
      nota: "Hasta el 4 de octubre. Después, 520 €."
      boton: "Reservar plaza"
      enlace: "@reservar_particulares"
    - titulo: "Empresas"
      precio: "624 €"
      nota: "Hasta el 4 de octubre. Después, 780 €."
      boton: "Reservar plaza"
      enlace: "@reservar_empresas"
  condiciones:
    titulo: "Condiciones"
    # (admite enlaces)
    puntos:
      - "El descuento del 20 % se aplica a las plazas confirmadas hasta el 4 de octubre."
      - "Tu empresa puede financiarlo. [Tienes un documento de patrocinio preparado](@patrocinio) para pedírselo."
      - "Si de verdad no puedes pagarlo, [escríbenos](@contacto). Buscamos una solución."
      - "Si te surge un imprevisto justificado, te guardamos la plaza para la siguiente edición al precio de esta."
      - "El precio incluye el programa. El alojamiento se reserva aparte."

# --- 9. TESTIMONIOS (citas literales, sin cambiar una palabra) --------
testimonios:
  titulo: "Lo que dicen quienes lo han hecho"
  lista:
    - cita: "He esperado unos días a contestar por si estaba de subidón al acabar y no era objetiva, pero es superrecomendable."
      autor: "Noelia Silvestre"
    - cita: "Me voy del curso con una claridad mental que pocas veces he tenido en mi vida y con las herramientas adecuadas para que dure, para que lo aprendido no se quede en una anécdota bonita que contar a los amigos en una cena."
      autor: "Juan Manuel Rodríguez"
    - cita: "El formato es ágil y fresco, no se hace pesado y a la vez te permite trabajar con gran profundidad. A pesar de que yo tengo bastante trabajo personal por ser psicóloga y psicoterapeuta, el proceso me ha servido mucho, me ha aclarado cosas y he ganado confianza y determinación."
      autor: "Marisa Palop"

# --- 10. PREGUNTAS FRECUENTES (la respuesta admite enlaces) -----------
preguntas:
  titulo: "Preguntas frecuentes"
  lista:
    - pregunta: "¿Es un programa teórico?"
      respuesta: "No. Trabajas sobre tu propia vida desde el primer momento. La teoría está al servicio de la práctica, no al revés."
    - pregunta: "No me apetece exponerme en grupo."
      respuesta: "Nadie te obliga a compartir nada. Escuchar a otras personas forma parte del método y suele ser lo que más se valora al terminar."
    - pregunta: "¿Hay una versión más corta?"
      respuesta: "No. Lo hemos probado con duraciones de entre día y medio y cuatro días. Dos días y medio es el mínimo que mantiene el resultado."
    - pregunta: "¿Qué pasa cuando termina?"
      respuesta: "Te llevas un plan para doce semanas y acompañamiento para ponerlo en marcha, mientras lo quieras. El trabajo de verdad empieza el lunes."
    - pregunta: "¿Y si no puedo asistir?"
      respuesta: "Con un motivo justificado, te guardamos la plaza para la siguiente edición al precio de esta."
    - pregunta: "¿Dónde duermo?"
      respuesta: "Recomendamos la propia residencia. Hay hoteles cerca, fuera de temporada alta. [Toda la logística, aquí](@logistica)."

# --- 11. CIERRE -------------------------------------------------------
cierre:
  etiqueta: "CreaTuVida · 23, 24 y 25 de octubre de 2026"
  titulo: "Una buena vida no se improvisa. Se diseña."
  texto: "Si tienes una duda que no está aquí, escríbenos antes de reservar."
  boton: "Reservar plaza"
  # Texto visible del enlace de contacto (la dirección real está en "enlaces")
  contacto_texto: "contacto@escueladeeudemonia.com"

# --- SOLO PARA EL BORRADOR: aviso de arriba y lista final para Pablo --
# Nada de este bloque saldrá en la página pública.
borrador:
  aviso_titulo: "Borrador para revisar"
  aviso_texto: "Esta no es la página pública del CreaTuVida, que sigue igual en /creatuvida/. Es la versión corta y estructurada propuesta el 3 de septiembre. Lo que hace falta decidir está al final de la página."
  decisiones_titulo: "Lo que hace falta decidir"
  decisiones_intro: "Esta parte no forma parte de la página. Es la lista de lo que bloquea publicarla."
  decisiones:
    - "Titular. «Dos días y medio para decidir cómo quieres vivir» sustituye a «Crea la vida que querrás haber vivido. Vive sin arrepentimientos». ¿Se queda, o vuelve el claim antiguo como titular o como línea previa?"
    - "Verónica. Aparece con nombre y apellido como cofacilitadora y presidenta de la Fundación, igual que en Transparencia. ¿Es compatible con lo acordado en junio sobre la página de equipo y el protectorado?"
    - "Bio de Verónica. Es mínima. Falta una línea de trayectoria suya."
    - "Alojamiento. La página dice que el precio incluye el programa y que el alojamiento se reserva aparte. ¿Es así? ¿Las comidas también van aparte?"
    - "Orden de precios. Particulares y autónomos van antes que empresas, porque es a quien habla la página. Antes iba empresas primero por ser el precio base."
    - "Testimonios. Se han dejado tres de los seis, recortados a frases completas sin cambiar una palabra. ¿Son los adecuados o prefieres otros?"
    - "Email de contacto. Se usa contacto@escueladeeudemonia.com, el mismo que Participa y las páginas legales. ¿Es el correcto para el CreaTuVida?"
    - "Lo que se ha quitado. Bronnie Ware y los cinco arrepentimientos, las tres noticias, la analogía de Ikea, seis preguntas de persuasión y los emojis. ¿Echas algo de menos?"
