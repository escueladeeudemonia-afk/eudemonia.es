# --- SEO: título de la pestaña y descripción para Google ---------------
meta:
  titulo: "CreaTuVida — Dos días y medio para decidir cómo quieres vivir"
  descripcion: "CreaTuVida es un programa presencial de dos días y medio en El Campello (Alicante), del 23 al 25 de octubre de 2026. Sales con claridad sobre lo que quieres y un plan para las próximas doce semanas. Fechas, precio y condiciones."

# --- 1. HERO: lo primero que se ve ------------------------------------
hero:
  etiqueta: "CreaTuVida · Edición de octubre de 2026"
  titulo: "Dos días y medio para decidir cómo quieres vivir."
  subtitulo: "Un programa presencial, en grupo, con un método de ocho pasos. Sales con claridad sobre lo que quieres y con un plan concreto para las próximas doce semanas."
  # Los cuatro datos de la franja bajo el subtítulo
  datos:
    - etiqueta: "Cuándo"
      valor: "23, 24 y 25 de octubre de 2026"
    - etiqueta: "Dónde"
      valor: "El Campello, Alicante"
    - etiqueta: "Formato"
      valor: "Presencial. Dos días y medio, en grupo"
    - etiqueta: "Precio"
      valor: "Desde 416 € hasta el 4 de octubre"
  boton: "Ver precio y reservar"
  enlace_secundario: "Cómo funciona"

# --- 2. QUÉ ES --------------------------------------------------------
que_es:
  titulo: "Qué es"
  parrafos:
    - "El CreaTuVida es un trabajo guiado sobre tu propia vida. Paras, miras tu vida entera con honestidad y decides su dirección. Después trazas el camino."
    - "No es un retiro. No es una charla motivacional. No promete cambiarte en un fin de semana. Te da un método, dos personas que lo dominan y un grupo con el que hacerlo."

# --- 3. PARA QUIÉN ES -------------------------------------------------
para_quien:
  titulo: "Para quién es"
  es_para_ti:
    titulo: "Es para ti si"
    puntos:
      - "Has tomado decisiones importantes por inercia o por expectativas ajenas y quieres revisarlas."
      - "Estás ante un cambio de etapa y no tienes claro cuál es el siguiente paso."
      - "Tienes muchas ideas en la cabeza y ninguna certeza."
      - "Sabes lo que quieres, pero no consigues pasar a la acción."
  no_es_para_ti:
    titulo: "No es para ti si"
    puntos:
      - "Buscas una charla inspiradora para volver a casa igual."
      - "Esperas que alguien decida por ti."
      - "No estás dispuesto a dedicar tres días a mirar tu vida con honestidad."

# --- 4. QUÉ TE LLEVAS -------------------------------------------------
que_te_llevas:
  titulo: "Qué te llevas"
  puntos:
    - titulo: "Claridad"
      texto: "Qué quieres de verdad, más allá de lo que crees que deberías querer."
    - titulo: "Diagnóstico"
      texto: "Las creencias y los hábitos que te frenan, identificados y con una alternativa."
    - titulo: "Un plan"
      texto: "Los pasos para las próximas doce semanas. Realistas y por escrito."
    - titulo: "Confianza"
      texto: "La seguridad que da haber decidido tú, con criterio propio."

# --- 5. CÓMO FUNCIONA (se numeran solos: 01, 02, 03...) ---------------
como_funciona:
  titulo: "Cómo funciona"
  pasos:
    - titulo: "Un método de ocho pasos"
      texto: "Desarrollado y aplicado durante más de veinte años con directivos de grandes organizaciones. Adaptado desde entonces a cualquier perfil."
    - titulo: "Práctica desde el primer minuto"
      texto: "La materia prima eres tú. La teoría aparece solo cuando sirve para avanzar."
    - titulo: "Trabajo en grupo, con respeto"
      texto: "Nadie te obliga a compartir lo que no quieras. Escuchar a otras personas forma parte del método."
    - titulo: "Dos facilitadores"
      texto: "Pablo Tovar y Verónica Menduiña conducen el programa de principio a fin."
    - titulo: "Un plan por escrito y acompañamiento después"
      texto: "Sales con los pasos para las próximas doce semanas. Y con apoyo para ponerlos en marcha, mientras lo quieras."

# --- 6. QUIÉN LO FACILITA ---------------------------------------------
facilitadores:
  titulo: "Quién lo facilita"
  personas:
    - nombre: "Pablo Tovar"
      rol: "Director general de la Fundación Eudemonía"
      bio: "Autor de Coaching para líderes cotidianos y presentador del podcast Eudemonía. Lleva más de veinte años desarrollando líderes y directivos en grandes organizaciones."
    - nombre: "Verónica Menduiña"
      rol: "Presidenta de la Fundación Eudemonía"
      bio: "Cofacilita el CreaTuVida junto a Pablo. Aporta la parte más emocional del trabajo, en palabras de quienes ya lo han hecho."

