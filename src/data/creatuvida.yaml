# =====================================================================
#  COPY DE LA PÁGINA DE VENTA DEL CREATUVIDA
# =====================================================================
#  Este archivo es el único sitio donde vive el texto de la página.
#  Edita aquí, haz commit y merge a main, y la web se reconstruye sola.
#
#  Reglas rápidas de YAML:
#   - Cada texto va entre comillas dobles: "así". Si necesitas comillas
#     dentro del texto, usa las españolas «así» o simples 'así'.
#   - Una línea que empieza por guion (-) es un elemento de una lista.
#     Respeta la sangría: es lo que marca a qué bloque pertenece cada cosa.
#   - Las líneas que empiezan por # son comentarios y no salen en la web.
#
#  Enlaces y negritas dentro de un texto:
#   [texto del enlace](@logistica)   → usa una URL del bloque "enlaces"
#   [texto del enlace](https://...)  → usa una URL directa
#   **texto en negrita**
#  Solo funcionan en los campos marcados con "(admite enlaces)".
# =====================================================================

# --- URLs. Cámbialas aquí y se actualizan en toda la página. ----------
