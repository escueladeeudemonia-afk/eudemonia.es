<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuál es tu cronotipo? · Eudemonía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--granate:#8F023D;--granate-osc:#6B012E;--tinta:#1A1A1A;--cuerpo:#2D2D2D;--papel:#FBFAF7;--gris:#9a8f93;--linea:#ece6e8;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Poppins',-apple-system,Arial,sans-serif;background:var(--papel);color:var(--cuerpo);line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:24px 20px 60px;min-height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .logo{height:38px;width:auto;flex:0 0 auto}
  .lang{margin-left:auto;font-size:13px;font-weight:500;color:var(--gris);user-select:none}
  .lang b{cursor:pointer;padding:2px 4px}
  .lang b.act{color:var(--granate);font-weight:700}
  .lang span{color:var(--linea)}
  .screen{flex:1;display:none;flex-direction:column;justify-content:center;animation:fade .35s ease}
  .screen.on{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1{font-weight:700;color:var(--tinta);font-size:30px;line-height:1.2;margin:18px 0 10px}
  .lead{font-size:16px;color:var(--cuerpo);margin-bottom:26px;max-width:560px}
  .cards{display:flex;flex-direction:column;gap:14px;max-width:520px}
  .card{border:1.5px solid var(--linea);border-radius:16px;padding:20px 22px;cursor:pointer;background:#fff;text-align:left;transition:.18s;font-family:'Poppins'}
  .card:hover{border-color:var(--granate);transform:translateY(-2px);box-shadow:0 6px 22px rgba(143,2,61,.10)}
  .card b{display:block;color:var(--tinta);font-size:18px;font-weight:600;margin-bottom:3px}
  .card span{font-size:14px;color:var(--gris)}
  .top{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  .bar{flex:1;height:7px;background:var(--linea);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--granate);width:0;transition:width .3s ease;border-radius:99px}
  .count{font-size:13px;color:var(--gris);font-weight:500;white-space:nowrap}
  .q{font-size:21px;font-weight:600;color:var(--tinta);line-height:1.35;margin-bottom:22px}
  .opts{display:flex;flex-direction:column;gap:11px}
  .opt{border:1.5px solid var(--linea);border-radius:13px;padding:15px 18px;cursor:pointer;background:#fff;text-align:left;font-family:'Poppins';font-size:16px;color:var(--cuerpo);transition:.15s}
  .opt:hover{border-color:var(--granate);background:#fdf4f8}
  .nav{margin-top:24px;display:flex}
  .back{background:none;border:none;color:var(--gris);font-family:'Poppins';font-size:14px;cursor:pointer;padding:6px 0}
  .back:hover{color:var(--granate)}
  .res-kicker{color:var(--gris);font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
  .res-name{font-size:34px;font-weight:700;color:var(--granate);line-height:1.15;margin-bottom:6px}
  .res-score{font-size:14px;color:var(--gris);margin-bottom:20px}
  .res-desc{font-size:16.5px;color:var(--cuerpo);max-width:580px;margin-bottom:18px}
  .scale{display:flex;gap:5px;max-width:560px;margin-bottom:8px}
  .scale div{flex:1;height:9px;border-radius:99px;background:var(--linea)}
  .scale div.act{background:var(--granate)}
  .scale-lbl{display:flex;justify-content:space-between;max-width:560px;font-size:11px;color:var(--gris);margin-bottom:24px}
  .ref{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:14px 18px;font-size:14px;color:var(--cuerpo);max-width:580px;margin-bottom:26px}
  .ref b{color:var(--tinta)}
  .btn{font-family:'Poppins';font-weight:600;font-size:15px;border-radius:11px;padding:13px 22px;cursor:pointer;border:none;background:var(--granate);color:#fff}
  .btn:hover{background:var(--granate-osc)}
  footer{margin-top:auto;padding-top:34px;font-size:11.5px;color:var(--gris);line-height:1.5}
  @media(max-width:480px){h1{font-size:25px}.res-name{font-size:28px}.q{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="https://eudemonia.es/brand/firma-eudemonia.png" alt="Eudemonía">
    <span class="lang"><b id="lang-es" class="act" onclick="setLang('es')">ES</b><span>·</span><b id="lang-en" onclick="setLang('en')">EN</b></span>
  </header>

  <section class="screen on" id="start">
    <h1 id="t-title"></h1>
    <p class="lead" id="t-lead"></p>
    <div class="cards">
      <button class="card" onclick="begin('r')"><b id="c1b"></b><span id="c1s"></span></button>
      <button class="card" onclick="begin('m')"><b id="c2b"></b><span id="c2s"></span></button>
    </div>
  </section>

  <section class="screen" id="quiz">
    <div class="top"><div class="bar"><i id="prog"></i></div><div class="count" id="count"></div></div>
    <div class="q" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="nav"><button class="back" id="back" onclick="goBack()"></button></div>
  </section>

  <section class="screen" id="result">
    <div class="res-kicker" id="r-kicker"></div>
    <div class="res-name" id="rname"></div>
    <div class="res-score" id="rscore"></div>
    <div class="scale" id="rscale"></div>
    <div class="scale-lbl"><span id="s-ev"></span><span id="s-int"></span><span id="s-mor"></span></div>
    <div class="res-desc" id="rdesc"></div>
    <div class="ref" id="rref"></div>
    <button class="btn" id="r-again" onclick="location.reload()"></button>
  </section>

  <footer id="t-footer"></footer>
</div>

<script>
/* ---------- i18n UI ---------- */
const I={
  es:{title:"¿Cuál es tu cronotipo?",
    lead:"Tu cronotipo es la tendencia natural de tu reloj interno a estar más activo por la mañana o por la noche. Elige una versión del test y descúbrelo al instante.",
    c1b:"Test rápido · 5 preguntas",c1s:"≈ 1 minuto · versión reducida (rMEQ)",
    c2b:"Test completo · 19 preguntas",c2s:"≈ 5 minutos · más preciso (MEQ, Horne & Östberg)",
    back:"← Atrás",kicker:"Tu cronotipo",again:"Hacer otro test",
    ev:"Vespertino",int:"Intermedio",mor:"Matutino",
    scoreR:" / 25 (test rápido)",scoreM:" / 86 (test completo)",scoreLbl:"Puntuación: ",
    refLbl:"Horario natural orientativo",
    refTxt:(a,b)=>"<b>"+I.es.refLbl+"</b> para tu cronotipo · Te dormirías sobre las <b>"+a+"</b> y te despertarías sobre las <b>"+b+"</b>. (Referencia aproximada; tu vida real puede diferir.)",
    footer:"Herramienta orientativa de autoconocimiento, no diagnóstica. Test rápido: versión reducida (rMEQ). Test completo: Morningness-Eveningness Questionnaire de Horne & Östberg (1976), versión de autoevaluación. Para la Escuela de Eudemonía."},
  en:{title:"What's your chronotype?",
    lead:"Your chronotype is your internal clock's natural tendency to be more active in the morning or at night. Pick a version of the test and find out instantly.",
    c1b:"Quick test · 5 questions",c1s:"≈ 1 minute · short version (rMEQ)",
    c2b:"Full test · 19 questions",c2s:"≈ 5 minutes · more accurate (MEQ, Horne & Östberg)",
    back:"← Back",kicker:"Your chronotype",again:"Take another test",
    ev:"Evening",int:"Intermediate",mor:"Morning",
    scoreR:" / 25 (quick test)",scoreM:" / 86 (full test)",scoreLbl:"Score: ",
    refLbl:"Approximate natural schedule",
    refTxt:(a,b)=>"<b>"+I.en.refLbl+"</b> for your chronotype · You'd fall asleep around <b>"+a+"</b> and wake up around <b>"+b+"</b>. (Rough reference; your real life may differ.)",
    footer:"An orientation tool for self-knowledge, not a diagnosis. Quick test: short version (rMEQ). Full test: Morningness-Eveningness Questionnaire by Horne & Östberg (1976), self-assessment version. For the Escuela de Eudemonía."}
};

/* ---------- Cronotipos (índice 0=vespertino extremo … 4=matutino extremo) ---------- */
const CATS=[
 {name:{es:"Claramente vespertino",en:"Definitely an evening type"},
  desc:{es:"Eres un búho de manual. Tu energía y tu lucidez aumentan según avanza el día y llegan a su pico por la noche. Las mañanas tempranas te penalizan; pelea por horarios que respeten tu ritmo y cuida la higiene de luz.",
        en:"You're a textbook night owl. Your energy and sharpness rise through the day and peak at night. Early mornings work against you; fight for a schedule that respects your rhythm and mind your light hygiene."},ref:["02:00 – 03:00","10:00 – 11:30"]},
 {name:{es:"Moderadamente vespertino",en:"Moderately an evening type"},
  desc:{es:"Tiendes a la tarde-noche. Te cuesta arrancar por la mañana y tu mejor momento llega más tarde. Si puedes, reserva lo más exigente para la tarde y cuida la transición al sueño.",
        en:"You lean toward the evening. Mornings are slow to start and your best moment comes later. If you can, save the demanding tasks for the afternoon and ease your transition into sleep."},ref:["00:45 – 02:00","08:30 – 10:00"]},
 {name:{es:"Intermedio",en:"Intermediate type"},
  desc:{es:"Ni búho ni alondra: tu reloj es flexible y se adapta a la mayoría de horarios. Tu rendimiento se reparte a lo largo del día. Te beneficia cuidar la regularidad de tus horarios.",
        en:"Neither owl nor lark: your clock is flexible and adapts to most schedules. Your performance spreads across the day. Keeping regular hours benefits you most."},ref:["22:45 – 00:45","06:30 – 08:30"]},
 {name:{es:"Moderadamente matutino",en:"Moderately a morning type"},
  desc:{es:"Tiendes a la mañana. Arrancas con buen pie y tu mejor momento llega temprano, con cierta flexibilidad. Aprovecha las mañanas para lo más exigente.",
        en:"You lean toward the morning. You start well and your best moment comes early, with some flexibility. Use the mornings for what's most demanding."},ref:["21:30 – 22:45","05:00 – 06:30"]},
 {name:{es:"Claramente matutino",en:"Definitely a morning type"},
  desc:{es:"Eres una alondra de manual. Tu energía y tu claridad mental despegan muy temprano y caen pronto al atardecer. Rindes mejor en las primeras horas; protege ese pico y evita citas importantes a última hora.",
        en:"You're a textbook early bird. Your energy and mental clarity take off very early and fade by evening. You perform best in the early hours; protect that peak and avoid important commitments late in the day."},ref:["21:00 – 21:30","04:00 – 05:00"]}
];

/* helper: opción puede ser string (igual en ambos idiomas) u objeto {es,en} */
function L(x){return (typeof x==='string')?x:x[LANG];}

/* ---------- rMEQ (5) ---------- */
const rMEQ=[
 {q:{es:"Si pudieras planificar libremente tu día, sin obligaciones, ¿a qué hora te levantarías?",en:"If you were entirely free to plan your day, what time would you get up?"},
  o:[["5:00 – 6:30",5],["6:30 – 7:45",4],["7:45 – 9:45",3],["9:45 – 11:00",2],[{es:"11:00 – 12:00 (o más tarde)",en:"11:00 – 12:00 (or later)"},1]]},
 {q:{es:"Durante la primera media hora tras despertarte, ¿cómo te sientes habitualmente?",en:"During the first half hour after waking up, how do you usually feel?"},
  o:[[{es:"Muy cansado / con mucho sueño",en:"Very tired / very sleepy"},1],[{es:"Bastante cansado",en:"Fairly tired"},2],[{es:"Bastante despejado",en:"Fairly refreshed"},3],[{es:"Muy despejado",en:"Very refreshed"},4]]},
 {q:{es:"¿A qué hora del día te sientes cansado y con necesidad de irte a dormir?",en:"At what time of day do you feel tired and in need of sleep?"},
  o:[["20:00 – 21:00",5],["21:00 – 22:15",4],["22:15 – 00:30",3],["00:30 – 1:45",2],[{es:"1:45 – 3:00 (o más tarde)",en:"1:45 – 3:00 (or later)"},1]]},
 {q:{es:"¿A qué hora del día te sientes en tu mejor momento, con más energía y claridad mental?",en:"At what time of day do you feel at your best, with most energy and mental clarity?"},
  o:[["5:00 – 8:00",5],["8:00 – 10:00",4],["10:00 – 17:00",3],["17:00 – 22:00",2],["22:00 – 5:00",1]]},
 {q:{es:"¿Cómo te catalogarías a ti mismo?",en:"How would you describe yourself?"},
  o:[[{es:"Claramente matutino",en:"Definitely a morning person"},6],[{es:"Más matutino que vespertino",en:"More morning than evening"},4],[{es:"Más vespertino que matutino",en:"More evening than morning"},2],[{es:"Claramente vespertino",en:"Definitely an evening person"},0]]}
];

/* ---------- MEQ (19) ---------- */
const MEQ=[
 {q:{es:"Si pudieras planificar tu día con total libertad, ¿aproximadamente a qué hora te levantarías?",en:"Approximately what time would you get up if you were entirely free to plan your day?"},
  o:[["5:00 – 6:30",5],["6:30 – 7:45",4],["7:45 – 9:45",3],["9:45 – 11:00",2],["11:00 – 12:00",1]]},
 {q:{es:"Si pudieras planificar tu noche con total libertad, ¿aproximadamente a qué hora te acostarías?",en:"Approximately what time would you go to bed if you were entirely free to plan your evening?"},
  o:[["20:00 – 21:00",5],["21:00 – 22:15",4],["22:15 – 00:30",3],["00:30 – 1:45",2],["1:45 – 3:00",1]]},
 {q:{es:"Si tienes que levantarte a una hora concreta por la mañana, ¿cuánto dependes del despertador?",en:"If you usually have to get up at a specific time, how much do you depend on an alarm clock?"},
  o:[[{es:"Nada",en:"Not at all"},4],[{es:"Un poco",en:"Slightly"},3],[{es:"Bastante",en:"Somewhat"},2],[{es:"Muchísimo",en:"Very much"},1]]},
 {q:{es:"¿Cuán fácil te resulta levantarte por la mañana (cuando no te despiertan de golpe)?",en:"How easy do you find it to get up in the morning (when not awakened unexpectedly)?"},
  o:[[{es:"Muy difícil",en:"Very difficult"},1],[{es:"Algo difícil",en:"Somewhat difficult"},2],[{es:"Bastante fácil",en:"Fairly easy"},3],[{es:"Muy fácil",en:"Very easy"},4]]},
 {q:{es:"¿Cuán despierto/a te sientes durante la primera media hora tras despertar?",en:"How alert do you feel during the first half hour after waking up?"},
  o:[[{es:"Nada despierto",en:"Not at all alert"},1],[{es:"Poco despierto",en:"Slightly alert"},2],[{es:"Bastante despierto",en:"Fairly alert"},3],[{es:"Muy despierto",en:"Very alert"},4]]},
 {q:{es:"¿Cuánta hambre tienes durante la primera media hora tras despertar?",en:"How hungry do you feel during the first half hour after waking up?"},
  o:[[{es:"Nada de hambre",en:"Not at all hungry"},1],[{es:"Poca hambre",en:"Slightly hungry"},2],[{es:"Bastante hambre",en:"Fairly hungry"},3],[{es:"Mucha hambre",en:"Very hungry"},4]]},
 {q:{es:"Durante la primera media hora tras despertar, ¿cómo te sientes?",en:"During the first half hour after waking up, how do you feel?"},
  o:[[{es:"Muy cansado",en:"Very tired"},1],[{es:"Bastante cansado",en:"Fairly tired"},2],[{es:"Bastante despejado/fresco",en:"Fairly refreshed"},3],[{es:"Muy despejado/fresco",en:"Very refreshed"},4]]},
 {q:{es:"Si no tuvieras compromisos al día siguiente, ¿a qué hora te acostarías respecto a tu hora habitual?",en:"If you had no commitments the next day, what time would you go to bed compared to your usual bedtime?"},
  o:[[{es:"Rara vez o nunca más tarde",en:"Seldom or never later"},4],[{es:"Menos de 1 hora más tarde",en:"Less than 1 hour later"},3],[{es:"1–2 horas más tarde",en:"1–2 hours later"},2],[{es:"Más de 2 horas más tarde",en:"More than 2 hours later"},1]]},
 {q:{es:"Vas a hacer ejercicio dos veces por semana, una hora, y el mejor momento de tu acompañante es entre las 7 y las 8 de la mañana. Pensando solo en tu reloj interno, ¿cómo crees que rendirías?",en:"You decide to exercise one hour twice a week, and your partner's best time is 7–8 AM. Considering only your internal clock, how would you perform?"},
  o:[[{es:"Estaría en buena forma",en:"Would be in good form"},4],[{es:"Estaría en forma razonable",en:"Would be in reasonable form"},3],[{es:"Me resultaría difícil",en:"Would find it difficult"},2],[{es:"Me resultaría muy difícil",en:"Would find it very difficult"},1]]},
 {q:{es:"¿Aproximadamente a qué hora de la tarde-noche te sientes cansado y con necesidad de dormir?",en:"At approximately what time in the evening do you feel tired and in need of sleep?"},
  o:[["20:00 – 21:00",5],["21:00 – 22:15",4],["22:15 – 00:45",3],["00:45 – 02:00",2],["02:00 – 03:00",1]]},
 {q:{es:"Quieres rendir al máximo en una prueba mentalmente agotadora de dos horas. Con libertad total y pensando solo en tu reloj interno, ¿qué franja elegirías?",en:"You want to peak for a two-hour, mentally exhausting test. Free to plan your day and considering only your internal clock, which time would you choose?"},
  o:[["8:00 – 10:00",6],["11:00 – 13:00",4],["15:00 – 17:00",2],["19:00 – 21:00",0]]},
 {q:{es:"Si te metieras en la cama a las 23:00, ¿cuán cansado estarías?",en:"If you went to bed at 23:00, how tired would you be?"},
  o:[[{es:"Nada cansado",en:"Not at all tired"},0],[{es:"Un poco cansado",en:"A little tired"},2],[{es:"Bastante cansado",en:"Fairly tired"},3],[{es:"Muy cansado",en:"Very tired"},5]]},
 {q:{es:"Te has acostado varias horas más tarde de lo habitual, pero no necesitas levantarte a ninguna hora concreta. ¿Qué es lo más probable que hagas?",en:"You've gone to bed several hours later than usual but need not get up at any set time. What are you most likely to do?"},
  o:[[{es:"Me despertaré a mi hora habitual y no volveré a dormirme",en:"Wake at my usual time and not fall back asleep"},4],[{es:"Me despertaré a mi hora habitual y dormitaré después",en:"Wake at my usual time and doze thereafter"},3],[{es:"Me despertaré a mi hora habitual pero volveré a dormirme",en:"Wake at my usual time but fall asleep again"},2],[{es:"No me despertaré hasta más tarde de lo habitual",en:"Not wake until later than usual"},1]]},
 {q:{es:"Una noche tienes que permanecer despierto entre las 4 y las 6 de la madrugada (una guardia). No tienes compromisos al día siguiente. ¿Qué te vendría mejor?",en:"One night you must stay awake from 4–6 AM for a night watch, with no commitments the next day. Which suits you best?"},
  o:[[{es:"No me acostaría hasta terminar la guardia",en:"Not go to bed until the watch is over"},1],[{es:"Echaría una siesta antes y dormiría después",en:"Nap before and sleep after"},2],[{es:"Dormiría bien antes y echaría una siesta después",en:"Sleep well before and nap after"},3],[{es:"Dormiría solo antes de la guardia",en:"Sleep only before the watch"},4]]},
 {q:{es:"Tienes dos horas de trabajo físico duro. Con libertad total y pensando solo en tu reloj interno, ¿qué franja elegirías?",en:"You have two hours of hard physical work. Free to plan your day and considering only your internal clock, which time would you choose?"},
  o:[["8:00 – 10:00",4],["11:00 – 13:00",3],["15:00 – 17:00",2],["19:00 – 21:00",1]]},
 {q:{es:"Vas a hacer ejercicio dos veces por semana, una hora, y el mejor momento de tu acompañante es entre las 22 y las 23 h. Pensando solo en tu reloj interno, ¿cómo crees que rendirías?",en:"You decide to exercise one hour twice a week, and your partner's best time is 10–11 PM. Considering only your internal clock, how would you perform?"},
  o:[[{es:"Estaría en buena forma",en:"Would be in good form"},1],[{es:"Estaría en forma razonable",en:"Would be in reasonable form"},2],[{es:"Me resultaría difícil",en:"Would find it difficult"},3],[{es:"Me resultaría muy difícil",en:"Would find it very difficult"},4]]},
 {q:{es:"Imagina que eliges tu horario: jornada de 5 horas (con descansos), trabajo interesante y pago por rendimiento. ¿A qué hora aproximada empezarías?",en:"Suppose you choose your work hours: a five-hour day (incl. breaks), interesting job, paid by performance. At about what time would you begin?"},
  o:[[{es:"5 h empezando entre las 4 y las 8",en:"5 h starting between 4–8 AM"},5],[{es:"5 h empezando entre las 8 y las 9",en:"5 h starting between 8–9 AM"},4],[{es:"5 h empezando entre las 9 y las 14",en:"5 h starting between 9 AM–2 PM"},3],[{es:"5 h empezando entre las 14 y las 17",en:"5 h starting between 2–5 PM"},2],[{es:"5 h empezando entre las 17 y las 4",en:"5 h starting between 5 PM–4 AM"},1]]},
 {q:{es:"¿A qué hora del día sueles sentirte en tu mejor momento?",en:"At approximately what time of day do you usually feel your best?"},
  o:[["5:00 – 8:00",5],["8:00 – 10:00",4],["10:00 – 17:00",3],["17:00 – 22:00",2],["22:00 – 5:00",1]]},
 {q:{es:"Se habla de «personas matutinas» y «personas vespertinas». ¿Cuál de estos tipos consideras que eres?",en:"One hears of \"morning types\" and \"evening types.\" Which do you consider yourself to be?"},
  o:[[{es:"Claramente matutina",en:"Definitely a morning type"},6],[{es:"Más matutina que vespertina",en:"Rather more morning than evening"},4],[{es:"Más vespertina que matutina",en:"Rather more evening than morning"},2],[{es:"Claramente vespertina",en:"Definitely an evening type"},1]]}
];

/* ---------- Lógica ---------- */
let LANG='es', DATA=[], idx=0, answers=[];
window._tipo='r'; window._result=null;

function setLang(l){
  LANG=l;
  document.documentElement.lang=l;
  document.getElementById('lang-es').classList.toggle('act',l==='es');
  document.getElementById('lang-en').classList.toggle('act',l==='en');
  paintStatic();
  if(document.getElementById('quiz').classList.contains('on')) render();
  if(document.getElementById('result').classList.contains('on')) renderResult();
}
function paintStatic(){
  const t=I[LANG];
  document.getElementById('t-title').textContent=t.title;
  document.getElementById('t-lead').textContent=t.lead;
  document.getElementById('c1b').textContent=t.c1b;
  document.getElementById('c1s').textContent=t.c1s;
  document.getElementById('c2b').textContent=t.c2b;
  document.getElementById('c2s').textContent=t.c2s;
  document.getElementById('back').textContent=t.back;
  document.getElementById('r-kicker').textContent=t.kicker;
  document.getElementById('r-again').textContent=t.again;
  document.getElementById('s-ev').textContent=t.ev;
  document.getElementById('s-int').textContent=t.int;
  document.getElementById('s-mor').textContent=t.mor;
  document.getElementById('t-footer').textContent=t.footer;
}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');window.scrollTo(0,0);}
function begin(t){DATA=(t==='r')?rMEQ:MEQ;window._tipo=t;idx=0;answers=[];show('quiz');render();}
function render(){
  const item=DATA[idx];
  document.getElementById('qtext').textContent=(idx+1)+". "+L(item.q);
  document.getElementById('count').textContent=(idx+1)+" / "+DATA.length;
  document.getElementById('prog').style.width=Math.round((idx)/DATA.length*100)+"%";
  document.getElementById('back').style.visibility=idx===0?'hidden':'visible';
  const box=document.getElementById('opts');box.innerHTML='';
  item.o.forEach(op=>{const b=document.createElement('button');b.className='opt';b.textContent=L(op[0]);b.onclick=()=>choose(op[1]);box.appendChild(b);});
}
function choose(p){answers[idx]=p;if(idx<DATA.length-1){idx++;render();}else finish();}
function goBack(){if(idx>0){idx--;render();}}
function finish(){
  const total=answers.reduce((a,b)=>a+b,0);
  const isR=(window._tipo==='r');
  let seg;
  if(isR){seg= total<=7?0: total<=11?1: total<=17?2: total<=21?3:4;}
  else{seg= total<=30?0: total<=41?1: total<=58?2: total<=69?3:4;}
  window._result={total,isR,seg};
  document.getElementById('prog').style.width='100%';
  renderResult();
  show('result');
}
function renderResult(){
  if(!window._result)return;
  const {total,isR,seg}=window._result, t=I[LANG], cat=CATS[seg];
  document.getElementById('rname').textContent=cat.name[LANG];
  document.getElementById('rscore').textContent=t.scoreLbl+total+(isR?t.scoreR:t.scoreM);
  document.getElementById('rdesc').textContent=cat.desc[LANG];
  const sc=document.getElementById('rscale');sc.innerHTML='';
  for(let i=0;i<5;i++){const d=document.createElement('div');if(i===seg)d.className='act';sc.appendChild(d);}
  document.getElementById('rref').innerHTML=t.refTxt(cat.ref[0],cat.ref[1]);
}
paintStatic();
</script>
</body>
