<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Eudemonía fundación">
  <title>Eudemonía fundación</title>
  <!-- Isotipo: 8 círculos outline + 1 relleno central -->
  <g transform="translate(50, 30)" stroke="#8F023D" stroke-width="6" fill="none">
    <circle cx="30" cy="30" r="22" />
    <circle cx="100" cy="30" r="22" />
    <circle cx="170" cy="30" r="22" />
    <circle cx="30" cy="100" r="22" />
    <circle cx="170" cy="100" r="22" />
    <circle cx="30" cy="170" r="22" />
    <circle cx="100" cy="170" r="22" />
    <circle cx="170" cy="170" r="22" />
  </g>
  <circle cx="150" cy="130" r="22" fill="#8F023D" />
  <!-- "EUDEMONÍA" en Poppins Regular con tracking 200 (0.2em) -->
  <text x="150" y="290" text-anchor="middle"
    font-family="Poppins, system-ui, sans-serif" font-weight="400"
    font-size="36" letter-spacing="7.2" fill="#8F023D">EUDEMONÍA</text>
  <!-- "fundación" en Poppins Light con tracking por defecto -->
  <text x="150" y="335" text-anchor="middle"
    font-family="Poppins, system-ui, sans-serif" font-weight="300"
    font-size="26" fill="#8F023D">fundación</text>
</svg>
