name: Cerrar inscripciones de CreaTuVida el 18 de octubre

on:
  schedule:
    # Madrid sigue en CEST: 21:59 UTC del 18-oct = 23:59 del 18-oct.
    # El primer disparo se adelanta y el script espera hasta la hora exacta.
    - cron: '43 21 18 10 *'
    # Reintentos independientes si GitHub retrasa o pierde el primer disparo.
    - cron: '7,17,27 22 18 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Comprobar la PR sin cerrar las inscripciones
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: creatuvida-cierre-18-oct
  cancel-in-progress: false

jobs:
  activar:
    if: github.repository == 'escueladeeudemonia-afk/eudemonia.es' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Probar las barreras de tiempo y contenido
        run: node --test scripts/close-creatuvida-registration.test.mjs
      - name: Fusionar la PR revisada y verificar la web
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/close-creatuvida-registration.mjs
