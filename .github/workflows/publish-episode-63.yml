name: Publicar episodio 63 el 15 de septiembre

on:
  schedule:
    # UTC: se prepara a las 07:17 de Madrid y espera a las 07:30.
    - cron: '17 5 15 9 *'
    # Reintentos independientes si se retrasa o falla la primera ejecución.
    - cron: '37,47 5 15 9 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Comprobar la configuración sin publicar
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: publicacion-episodio-63
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'escueladeeudemonia-afk/eudemonia.es' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar la versión de main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Comprobar la fusión sin modificar ninguna rama
        run: git merge-tree --write-tree HEAD aca9906871275c0312906c5caa0d600059060504
      - name: Verificar las restricciones del publicador
        run: node --test scripts/publish-episode-63.test.mjs
      - name: Comprobar o publicar y verificar el despliegue
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/publish-episode-63.mjs
