name: Publicar episodio 65 el 15 de octubre a las 00:30 de Madrid

on:
  schedule:
    # 22:30 UTC del 14-oct = 00:30 del 15-oct en Madrid (CEST).
    # El script espera al corte si GitHub arranca antes.
    - cron: '13 22 14 10 *'
    - cron: '37,47,57 22 14 10 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Revisar la publicación sin fusionar ni desplegar
        type: boolean
        required: true
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: podcast-ep65-20261015
  cancel-in-progress: false

jobs:
  publicar:
    if: github.repository == 'escueladeeudemonia-afk/eudemonia.es' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Probar las barreras y la verificación
        run: node --test scripts/publish-episode-65.test.mjs
      - name: Publicar la PR revisada y verificar la web
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: node scripts/publish-episode-65.mjs
