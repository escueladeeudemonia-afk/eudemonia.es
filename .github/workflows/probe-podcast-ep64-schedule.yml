name: Comprobar calendario del episodio 64

on:
  schedule:
    # Prueba temporal: 30-sep-2026, minutos 01, 06, ..., 56 de las 05 y 06 UTC.
    - cron: '1-56/5 5,6 30 9 *'

permissions:
  contents: read

jobs:
  comprobar:
    if: github.repository == 'escueladeeudemonia-afk/eudemonia.es' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar disparo real del calendario
        run: |
          test '${{ github.event_name }}' = 'schedule'
          date -u '+Disparo programado: %Y-%m-%dT%H:%M:%SZ'
